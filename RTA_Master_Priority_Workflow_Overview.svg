<svg width="100%" viewBox="0 0 680 620" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>RTA Asset Management – Master Excel Workflow (overview)</title>
  <desc>High-level flowchart: Asset Excel files are extracted, consolidated, scored with PF, sorted, and written to a three-sheet Master_Priority_Output.xlsx.</desc>

  <style>
    text { font-family: "Segoe UI", system-ui, -apple-system, sans-serif; }
    .title { font-size: 14px; font-weight: 600; }
    .sub   { font-size: 11.5px; font-weight: 400; }
  </style>

  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- ===== NODE A: Asset Excel files ===== -->
  <rect x="190" y="24" width="300" height="44" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/>
  <text class="title" x="340" y="51" text-anchor="middle" fill="#2C2C2A">Asset Excel files</text>

  <!-- Arrow A→B -->
  <line x1="340" y1="68" x2="340" y2="94" stroke="#888780" stroke-width="1.2" marker-end="url(#ah)"/>

  <!-- ===== NODE B: Extract rows ===== -->
  <rect x="190" y="94" width="300" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.6"/>
  <text class="title" x="340" y="117" text-anchor="middle" fill="#085041">Extract rows</text>
  <text class="sub" x="340" y="136" text-anchor="middle" fill="#0F6E56">Normalize columns via COLUMN_ALIASES</text>

  <!-- Arrow B→C -->
  <line x1="340" y1="150" x2="340" y2="176" stroke="#888780" stroke-width="1.2" marker-end="url(#ah)"/>

  <!-- ===== NODE C: Consolidate ===== -->
  <rect x="190" y="176" width="300" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.6"/>
  <text class="title" x="340" y="203" text-anchor="middle" fill="#085041">Consolidate into unified table</text>

  <!-- Arrow C→D -->
  <line x1="340" y1="220" x2="340" y2="246" stroke="#888780" stroke-width="1.2" marker-end="url(#ah)"/>

  <!-- ===== NODE D: Compute PF ===== -->
  <rect x="155" y="246" width="370" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.6"/>
  <text class="title" x="340" y="269" text-anchor="middle" fill="#712B13">Compute PF = 0.60·CF + 0.20·RF + 0.20·FLF</text>
  <text class="sub" x="340" y="288" text-anchor="middle" fill="#993C1D">Derive missing factors from ACI + Asset_Type</text>

  <!-- Arrow D→E -->
  <line x1="340" y1="302" x2="340" y2="328" stroke="#888780" stroke-width="1.2" marker-end="url(#ah)"/>

  <!-- ===== NODE E: Sort ===== -->
  <rect x="190" y="328" width="300" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.6"/>
  <text class="title" x="340" y="355" text-anchor="middle" fill="#085041">Sort: PF desc, ACI asc</text>

  <!-- Arrow E→F -->
  <line x1="340" y1="372" x2="340" y2="400" stroke="#888780" stroke-width="1.2" marker-end="url(#ah)"/>

  <!-- ===== NODE F: Master_Priority_Output.xlsx (cylinder) ===== -->
  <ellipse cx="340" cy="410" rx="150" ry="14" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
  <rect x="190" y="410" width="300" height="48" fill="#E6F1FB" stroke="none"/>
  <line x1="190" y1="410" x2="190" y2="458" stroke="#185FA5" stroke-width="0.8"/>
  <line x1="490" y1="410" x2="490" y2="458" stroke="#185FA5" stroke-width="0.8"/>
  <ellipse cx="340" cy="458" rx="150" ry="14" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
  <text class="title" x="340" y="440" text-anchor="middle" fill="#0C447C">Master_Priority_Output.xlsx</text>

  <!-- Fan-out arrows to 3 sheets -->
  <line x1="240" y1="472" x2="118" y2="510" stroke="#888780" stroke-width="1.2" marker-end="url(#ah)"/>
  <line x1="340" y1="472" x2="340" y2="510" stroke="#888780" stroke-width="1.2" marker-end="url(#ah)"/>
  <line x1="440" y1="472" x2="562" y2="510" stroke="#888780" stroke-width="1.2" marker-end="url(#ah)"/>

  <!-- ===== NODE G: Priority Ranking ===== -->
  <rect x="28" y="510" width="186" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.6"/>
  <text class="title" x="121" y="533" text-anchor="middle" fill="#0C447C">Priority Ranking</text>
  <text class="sub" x="121" y="552" text-anchor="middle" fill="#185FA5">Rank, color scales, filters</text>

  <!-- ===== NODE H: Summary Statistics ===== -->
  <rect x="247" y="510" width="186" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.6"/>
  <text class="title" x="340" y="533" text-anchor="middle" fill="#0C447C">Summary Statistics</text>
  <text class="sub" x="340" y="552" text-anchor="middle" fill="#185FA5">Formulas, top-10, bands</text>

  <!-- ===== NODE I: Source Mapping ===== -->
  <rect x="466" y="510" width="186" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.6"/>
  <text class="title" x="559" y="533" text-anchor="middle" fill="#0C447C">Source Mapping</text>
  <text class="sub" x="559" y="552" text-anchor="middle" fill="#185FA5">File/sheet row counts</text>

</svg>
