<svg width="100%" viewBox="0 0 680 1470" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>RTA Asset Management – Master Excel Workflow</title>
  <desc>Flowchart showing how multiple per-asset-type Excel inputs are consolidated into a single ranked Master_Priority_Output.xlsx through discovery, extraction, PF computation, and formatted output generation.</desc>

  <style>
    text { font-family: "Segoe UI", system-ui, -apple-system, sans-serif; }
    .title { font-size: 14px; font-weight: 600; }
    .sub   { font-size: 11.5px; font-weight: 400; }
    .lbl   { font-size: 11px; font-weight: 500; }
    .arr   { stroke-width: 1.2; }
  </style>

  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- ===== NODE 1: Raw input files ===== -->
  <rect x="115" y="28" width="290" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/>
  <text class="title" x="260" y="51" text-anchor="middle" fill="#2C2C2A">Raw input .xlsx files</text>
  <text class="sub" x="260" y="70" text-anchor="middle" fill="#5F5E5A">RoW Assets, MASTER_EXCEL_E11, …</text>

  <!-- Arrow 1→2 -->
  <line x1="260" y1="84" x2="260" y2="110" class="arr" stroke="#888780" marker-end="url(#ah)"/>

  <!-- ===== NODE 2: discover_input_files ===== -->
  <rect x="130" y="110" width="260" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.6"/>
  <text class="title" x="260" y="133" text-anchor="middle" fill="#085041">discover_input_files</text>
  <text class="sub" x="260" y="152" text-anchor="middle" fill="#0F6E56">Auto-discover .xlsx in parent dir</text>

  <!-- Arrow 2→3 -->
  <line x1="260" y1="166" x2="260" y2="192" class="arr" stroke="#888780" marker-end="url(#ah)"/>

  <!-- ===== NODE 3: load_workbook ===== -->
  <rect x="130" y="192" width="260" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.6"/>
  <text class="title" x="260" y="215" text-anchor="middle" fill="#085041">openpyxl load_workbook</text>
  <text class="sub" x="260" y="234" text-anchor="middle" fill="#0F6E56">For each file, read-only mode</text>

  <!-- Arrow 3→4 -->
  <line x1="260" y1="248" x2="260" y2="274" class="arr" stroke="#888780" marker-end="url(#ah)"/>

  <!-- ===== NODE 4: _find_header_row ===== -->
  <rect x="130" y="274" width="260" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.6"/>
  <text class="title" x="260" y="297" text-anchor="middle" fill="#085041">_find_header_row</text>
  <text class="sub" x="260" y="316" text-anchor="middle" fill="#0F6E56">Scan first 12 rows for ACI / PF / CF</text>

  <!-- Arrow 4→5 -->
  <line x1="260" y1="330" x2="260" y2="356" class="arr" stroke="#888780" marker-end="url(#ah)"/>

  <!-- ===== NODE 5: is_inventory_sheet? (decision) ===== -->
  <rect x="130" y="356" width="260" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
  <text class="title" x="260" y="383" text-anchor="middle" fill="#3C3489">is_inventory_sheet?</text>

  <!-- "no" branch → right -->
  <line x1="390" y1="378" x2="460" y2="378" class="arr" stroke="#534AB7" marker-end="url(#ah)"/>
  <text class="lbl" x="418" y="371" text-anchor="middle" fill="#534AB7">no</text>
  <text class="sub" x="466" y="383" fill="#5F5E5A" text-anchor="start">Skip → next sheet</text>

  <!-- Loop-back arrow (right side, from skip back up to node 3 level) -->
  <path d="M540 383 L540 204 L394 204" fill="none" class="arr" stroke="#888780" stroke-dasharray="4 3" marker-end="url(#ah)"/>
  <text class="lbl" x="548" y="290" fill="#5F5E5A" transform="rotate(90 548 290)" text-anchor="middle">loop sheets</text>

  <!-- "yes" label -->
  <text class="lbl" x="248" y="413" text-anchor="end" fill="#0F6E56">yes</text>

  <!-- Arrow 5→6 -->
  <line x1="260" y1="400" x2="260" y2="426" class="arr" stroke="#888780" marker-end="url(#ah)"/>

  <!-- ===== NODE 6: extract_sheet ===== -->
  <rect x="130" y="426" width="260" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.6"/>
  <text class="title" x="260" y="449" text-anchor="middle" fill="#085041">extract_sheet</text>
  <text class="sub" x="260" y="468" text-anchor="middle" fill="#0F6E56">Normalize headers via COLUMN_ALIASES</text>

  <!-- Arrow 6→7 -->
  <line x1="260" y1="482" x2="260" y2="508" class="arr" stroke="#888780" marker-end="url(#ah)"/>

  <!-- ===== NODE 7: Build AssetRow ===== -->
  <rect x="130" y="508" width="260" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.6"/>
  <text class="title" x="260" y="531" text-anchor="middle" fill="#085041">Build AssetRow per row</text>
  <text class="sub" x="260" y="550" text-anchor="middle" fill="#0F6E56">Infer Asset_Type, stamp source</text>

  <!-- Arrow 7→8 -->
  <line x1="260" y1="564" x2="260" y2="590" class="arr" stroke="#888780" marker-end="url(#ah)"/>

  <!-- ===== NODE 8: Drop invalid rows ===== -->
  <rect x="130" y="590" width="260" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.6"/>
  <text class="title" x="260" y="617" text-anchor="middle" fill="#085041">Drop invalid rows</text>

  <!-- Separator: "all sheets/files done" label -->
  <line x1="60" y1="660" x2="620" y2="660" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="3 3"/>
  <text class="lbl" x="340" y="654" text-anchor="middle" fill="#888780">all sheets / files processed</text>

  <!-- Arrow 8→9 -->
  <line x1="260" y1="634" x2="260" y2="680" class="arr" stroke="#888780" marker-end="url(#ah)"/>

  <!-- ===== NODE 9: consolidate ===== -->
  <rect x="130" y="680" width="260" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.6"/>
  <text class="title" x="260" y="703" text-anchor="middle" fill="#712B13">consolidate</text>
  <text class="sub" x="260" y="722" text-anchor="middle" fill="#993C1D">Merge all SheetExtracts, order extras</text>

  <!-- Arrow 9→10 -->
  <line x1="260" y1="736" x2="260" y2="762" class="arr" stroke="#888780" marker-end="url(#ah)"/>

  <!-- ===== NODE 10: compute_missing_pf ===== -->
  <rect x="130" y="762" width="260" height="44" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.6"/>
  <text class="title" x="260" y="789" text-anchor="middle" fill="#712B13">compute_missing_pf</text>

  <!-- Arrow 10→11 -->
  <line x1="260" y1="806" x2="260" y2="836" class="arr" stroke="#888780" marker-end="url(#ah)"/>

  <!-- ===== NODE 11: PF already present? (decision) ===== -->
  <rect x="130" y="836" width="260" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
  <text class="title" x="260" y="863" text-anchor="middle" fill="#3C3489">PF already present?</text>

  <!-- "yes" branch → right to "Keep PF" -->
  <line x1="390" y1="858" x2="442" y2="858" class="arr" stroke="#534AB7" marker-end="url(#ah)"/>
  <text class="lbl" x="410" y="851" text-anchor="middle" fill="#534AB7">yes</text>

  <!-- ===== NODE 12: Keep PF as-is (right branch) ===== -->
  <rect x="442" y="836" width="160" height="44" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.6"/>
  <text class="title" x="522" y="855" text-anchor="middle" fill="#2C2C2A">Keep PF as-is</text>
  <text class="sub" x="522" y="872" text-anchor="middle" fill="#5F5E5A">PF_Computed = False</text>

  <!-- Keep PF long arrow down to Sort -->
  <path d="M602 858 L628 858 L628 1120 L394 1120" fill="none" class="arr" stroke="#888780" marker-end="url(#ah)"/>

  <!-- "no" label for PF present -->
  <text class="lbl" x="248" y="893" text-anchor="end" fill="#993C1D">no</text>

  <!-- Arrow 11→13 -->
  <line x1="260" y1="880" x2="260" y2="910" class="arr" stroke="#888780" marker-end="url(#ah)"/>

  <!-- ===== NODE 13: CF, RF, FLF all present? (decision) ===== -->
  <rect x="130" y="910" width="260" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
  <text class="title" x="260" y="937" text-anchor="middle" fill="#3C3489">CF, RF, FLF all present?</text>

  <!-- "yes" from 13 → right, L-bend down to PF formula -->
  <line x1="390" y1="932" x2="430" y2="932" class="arr" stroke="#534AB7"/>
  <path d="M430 932 L430 1050 L404 1050" fill="none" class="arr" stroke="#888780" marker-end="url(#ah)"/>
  <text class="lbl" x="410" y="925" text-anchor="middle" fill="#534AB7">yes</text>

  <!-- "no" label -->
  <text class="lbl" x="248" y="967" text-anchor="end" fill="#993C1D">no</text>

  <!-- Arrow 13→14 -->
  <line x1="260" y1="954" x2="260" y2="980" class="arr" stroke="#888780" marker-end="url(#ah)"/>

  <!-- ===== NODE 14: Derive missing factors ===== -->
  <rect x="130" y="980" width="260" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.6"/>
  <text class="title" x="260" y="1003" text-anchor="middle" fill="#712B13">Derive missing factors</text>
  <text class="sub" x="260" y="1022" text-anchor="middle" fill="#993C1D">CF, RF, FLF from ACI + Asset_Type</text>

  <!-- Arrow 14→15 -->
  <line x1="260" y1="1036" x2="260" y2="1062" class="arr" stroke="#888780" marker-end="url(#ah)"/>

  <!-- ===== NODE 15: PF formula ===== -->
  <rect x="100" y="1062" width="304" height="44" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
  <text class="title" x="252" y="1089" text-anchor="middle" fill="#712B13">PF = 0.60·CF + 0.20·RF + 0.20·FLF</text>

  <!-- Arrow 15→16 -->
  <line x1="260" y1="1106" x2="260" y2="1132" class="arr" stroke="#888780" marker-end="url(#ah)"/>

  <!-- ===== NODE 16: Sort ===== -->
  <rect x="130" y="1132" width="260" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.6"/>
  <text class="title" x="260" y="1155" text-anchor="middle" fill="#085041">Sort</text>
  <text class="sub" x="260" y="1174" text-anchor="middle" fill="#0F6E56">PF desc → ACI asc → Asset_Type asc</text>

  <!-- Arrow 16→17 -->
  <line x1="260" y1="1188" x2="260" y2="1214" class="arr" stroke="#888780" marker-end="url(#ah)"/>

  <!-- ===== NODE 17: xlsxwriter Workbook ===== -->
  <rect x="130" y="1214" width="260" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.6"/>
  <text class="title" x="260" y="1237" text-anchor="middle" fill="#0C447C">xlsxwriter Workbook</text>
  <text class="sub" x="260" y="1256" text-anchor="middle" fill="#185FA5">constant_memory = True</text>

  <!-- Fan-out arrows to 3 sheets -->
  <line x1="165" y1="1270" x2="115" y2="1306" class="arr" stroke="#888780" marker-end="url(#ah)"/>
  <line x1="260" y1="1270" x2="260" y2="1306" class="arr" stroke="#888780" marker-end="url(#ah)"/>
  <line x1="355" y1="1270" x2="505" y2="1306" class="arr" stroke="#888780" marker-end="url(#ah)"/>

  <!-- ===== NODE 18a: Priority Ranking ===== -->
  <rect x="25" y="1306" width="186" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.6"/>
  <text class="title" x="118" y="1329" text-anchor="middle" fill="#0C447C">Priority Ranking</text>
  <text class="sub" x="118" y="1348" text-anchor="middle" fill="#185FA5">Rank, color scales, filters</text>

  <!-- ===== NODE 18b: Summary Statistics ===== -->
  <rect x="234" y="1306" width="186" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.6"/>
  <text class="title" x="327" y="1329" text-anchor="middle" fill="#0C447C">Summary Statistics</text>
  <text class="sub" x="327" y="1348" text-anchor="middle" fill="#185FA5">Formulas, top-10, bands</text>

  <!-- ===== NODE 18c: Source Mapping ===== -->
  <rect x="443" y="1306" width="186" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.6"/>
  <text class="title" x="536" y="1329" text-anchor="middle" fill="#0C447C">Source Mapping</text>
  <text class="sub" x="536" y="1348" text-anchor="middle" fill="#185FA5">File/sheet row counts</text>

  <!-- Converging arrows to output -->
  <line x1="118" y1="1362" x2="228" y2="1402" class="arr" stroke="#888780" marker-end="url(#ah)"/>
  <line x1="327" y1="1362" x2="310" y2="1402" class="arr" stroke="#888780" marker-end="url(#ah)"/>
  <line x1="536" y1="1362" x2="420" y2="1402" class="arr" stroke="#888780" marker-end="url(#ah)"/>

  <!-- ===== NODE 19: Master_Priority_Output.xlsx ===== -->
  <rect x="170" y="1402" width="300" height="44" rx="22" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.2"/>
  <text class="title" x="320" y="1429" text-anchor="middle" fill="#2C2C2A">Master_Priority_Output.xlsx</text>

</svg>
